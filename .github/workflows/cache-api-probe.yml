name: Cache API probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe-write:
    runs-on: ubuntu-latest
    cache-mode: write
    steps:
      - name: Prime cache env (write)
        uses: actions/cache/restore@v4
        with:
          path: cache-probe
          key: prime-write-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: false

      - name: Probe cache API (write)
        run: |
          set +x
          echo "ACTIONS_CACHE_URL set: ${ACTIONS_CACHE_URL:+yes}"
          echo "ACTIONS_RUNTIME_TOKEN set: ${ACTIONS_RUNTIME_TOKEN:+yes}"
          BASE="${ACTIONS_CACHE_URL%/}"
          K="probe-${{ github.run_id }}-${{ github.run_attempt }}-write"
          V="probev1"

          echo "--- 1) GET list with key"
          curl -sS -o /dev/null -w "  status=%{http_code}\n" \
            -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
            "$BASE/_apis/artifactcache/caches?keys=$K&version=$V" || echo "  curl failed"

          echo "--- 2) POST reserve (create entry)"
          curl -sS -o /dev/null -w "  status=%{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json;api-version=6.0-preview.1" \
            -d "{\"key\":\"$K\",\"version\":\"$V\"}" \
            "$BASE/_apis/artifactcache/caches" || echo "  curl failed"

          echo "--- 3) POST finalize with bogus cacheId"
          curl -sS -o /dev/null -w "  status=%{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"size\":1}" \
            "$BASE/_apis/artifactcache/caches/999999999" || echo "  curl failed"

  probe-read:
    runs-on: ubuntu-latest
    cache-mode: read
    steps:
      - name: Prime cache env (read)
        uses: actions/cache/restore@v4
        with:
          path: cache-probe
          key: prime-read-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: false

