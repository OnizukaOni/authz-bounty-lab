name: Cache API probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe-write:
    runs-on: ubuntu-latest
    cache-mode: write
    steps:
      - name: Probe cache API (write)
        run: |
          set +x
          HOST=$(python3 -c "import urllib.parse,os;print(urllib.parse.urlparse(os.environ['ACTIONS_CACHE_URL']).netloc)")
          echo "cache host: $HOST"
          BASE="${ACTIONS_CACHE_URL%/}"
          K="probe-${{ github.run_id }}-${{ github.run_attempt }}-write"
          V="probev1"

          echo "--- 1) GET list with key"
          curl -s -o /dev/null -w "  status=%{http_code}\n" \
            -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
            "$BASE/_apis/artifactcache/caches?keys=$K&version=$V"

          echo "--- 2) POST reserve (create entry)"
          curl -s -o /dev/null -w "  status=%{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json;api-version=6.0-preview.1" \
            -d "{\"key\":\"$K\",\"version\":\"$V\"}" \
            "$BASE/_apis/artifactcache/caches"

          echo "--- 3) POST finalize with bogus cacheId"
          curl -s -o /dev/null -w "  status=%{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"size\":1}" \
            "$BASE/_apis/artifactcache/caches/999999999"

  probe-read:
    runs-on: ubuntu-latest
    cache-mode: read
    steps:
      - name: Probe cache API (read)
        run: |
          set +x
          HOST=$(python3 -c "import urllib.parse,os;print(urllib.parse.urlparse(os.environ['ACTIONS_CACHE_URL']).netloc)")
          echo "cache host: $HOST"
          BASE="${ACTIONS_CACHE_URL%/}"
          K="probe-${{ github.run_id }}-${{ github.run_attempt }}-read"
          V="probev1"

          echo "--- 1) GET list with key"
          curl -s -o /dev/null -w "  status=%{http_code}\n" \
            -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
            "$BASE/_apis/artifactcache/caches?keys=$K&version=$V"

          echo "--- 2) POST reserve (create entry)"
          curl -s -o /dev/null -w "  status=%{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json;api-version=6.0-preview.1" \
            -d "{\"key\":\"$K\",\"version\":\"$V\"}" \
            "$BASE/_apis/artifactcache/caches"

          echo "--- 3) POST finalize with bogus cacheId"
          curl -s -o /dev/null -w "  status=%{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"size\":1}" \
            "$BASE/_apis/artifactcache/caches/999999999"

  probe-none:
    runs-on: ubuntu-latest
    cache-mode: none
    steps:
      - name: Probe cache API (none)
        run: |
          set +x
          HOST=$(python3 -c "import urllib.parse,os;print(urllib.parse.urlparse(os.environ['ACTIONS_CACHE_URL']).netloc)")
          echo "cache host: $HOST"
          BASE="${ACTIONS_CACHE_URL%/}"
          K="probe-${{ github.run_id }}-${{ github.run_attempt }}-none"
          V="probev1"

          echo "--- 1) GET list with key"
          curl -s -o /dev/null -w "  status=%{http_code}\n" \
            -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
            "$BASE/_apis/artifactcache/caches?keys=$K&version=$V"

          echo "--- 2) POST reserve (create entry)"
          curl -s -o /dev/null -w "  status=%{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json;api-version=6.0-preview.1" \
            -d "{\"key\":\"$K\",\"version\":\"$V\"}" \
            "$BASE/_apis/artifactcache/caches"

          echo "--- 3) POST finalize with bogus cacheId"
          curl -s -o /dev/null -w "  status=%{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"size\":1}" \
            "$BASE/_apis/artifactcache/caches/999999999"
