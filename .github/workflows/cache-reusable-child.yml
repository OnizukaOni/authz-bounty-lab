name: Cache reusable child

on:
  workflow_call:

permissions: {}

jobs:
  child-write:
    runs-on: ubuntu-latest
    cache-mode: write
    steps:
      - name: Create marker
        run: |
          mkdir -p cache-probe
          printf '%s\n' "child-${GITHUB_RUN_ID}-${GITHUB_JOB}" > cache-probe/marker.txt
          cat cache-probe/marker.txt
      - name: Attempt save
        uses: actions/cache/save@v4
        with:
          path: cache-probe
          key: child-write-${{ github.run_id }}-${{ github.run_attempt }}

  child-inherit:
    runs-on: ubuntu-latest
    steps:
      - name: Create marker
        run: |
          mkdir -p cache-probe
          printf '%s\n' "child-${GITHUB_RUN_ID}-${GITHUB_JOB}" > cache-probe/marker.txt
          cat cache-probe/marker.txt
      - name: Attempt save
        uses: actions/cache/save@v4
        with:
          path: cache-probe
          key: child-inherit-${{ github.run_id }}-${{ github.run_attempt }}
