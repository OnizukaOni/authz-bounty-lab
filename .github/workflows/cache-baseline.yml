name: Cache permissions baseline

on:
  workflow_dispatch:

permissions: {}

jobs:
  allowed:
    runs-on: ubuntu-latest
    cache-mode: write
    steps:
      - name: Create harmless marker
        run: |
          mkdir -p cache-probe
          printf '%s\n' "baseline-${GITHUB_RUN_ID}-${GITHUB_JOB}" > cache-probe/marker.txt
          cat cache-probe/marker.txt

      - name: Save with write permission
        uses: actions/cache/save@v4
        with:
          path: cache-probe
          key: baseline-write-${{ github.run_id }}-${{ github.run_attempt }}

  restricted:
    runs-on: ubuntu-latest
    cache-mode: read
    steps:
      - name: Create harmless marker
        run: |
          mkdir -p cache-probe
          printf '%s\n' "baseline-${GITHUB_RUN_ID}-${GITHUB_JOB}" > cache-probe/marker.txt
          cat cache-probe/marker.txt

      - name: Attempt save with read permission
        uses: actions/cache/save@v4
        with:
          path: cache-probe
          key: baseline-read-${{ github.run_id }}-${{ github.run_attempt }}

  verify-write:
    runs-on: ubuntu-latest
    needs: [allowed]
    cache-mode: read
    steps:
      - name: Try restore write key
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: cache-probe
          key: baseline-write-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: false

      - name: Show write marker
        if: steps.restore.outputs.cache-hit == 'true'
        run: cat cache-probe/marker.txt

  verify-read:
    runs-on: ubuntu-latest
    needs: [restricted]
    cache-mode: read
    steps:
      - name: Try restore read key
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: cache-probe
          key: baseline-read-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: false

      - name: Show read marker
        if: steps.restore.outputs.cache-hit == 'true'
        run: cat cache-probe/marker.txt
