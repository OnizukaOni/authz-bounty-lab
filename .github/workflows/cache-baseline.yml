name: Cache permissions baseline

on:
  workflow_dispatch:

permissions: {}

jobs:
  trace-write:
    runs-on: ubuntu-latest
    cache-mode: write
    env:
      ACTIONS_STEP_DEBUG: "true"
    steps:
      - name: Create harmless marker
        run: |
          mkdir -p cache-probe
          printf '%s\n' "trace-${GITHUB_RUN_ID}-${GITHUB_JOB}" > cache-probe/marker.txt
          cat cache-probe/marker.txt

      - name: Save with write permission
        uses: actions/cache/save@v4
        with:
          path: cache-probe
          key: trace-write-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Show cache env (no secrets)
        run: |
          env | grep -i '^ACTIONS_' | grep -viE 'TOKEN|URL|SECRET|KEY|SIGNATURE' | sort

  trace-read:
    runs-on: ubuntu-latest
    cache-mode: read
    env:
      ACTIONS_STEP_DEBUG: "true"
    steps:
      - name: Create harmless marker
        run: |
          mkdir -p cache-probe
          printf '%s\n' "trace-${GITHUB_RUN_ID}-${GITHUB_JOB}" > cache-probe/marker.txt
          cat cache-probe/marker.txt

      - name: Attempt save with read permission
        uses: actions/cache/save@v4
        with:
          path: cache-probe
          key: trace-read-${{ github.run_id }}-${{ github.run_attempt }}
