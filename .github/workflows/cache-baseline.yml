name: Cache permissions baseline

on:
  workflow_dispatch:

permissions: {}

jobs:
  seed:
    runs-on: ubuntu-latest
    cache-mode: write
    steps:
      - name: Create marker
        run: |
          mkdir -p cache-probe
          printf '%s\n' "seed-${GITHUB_RUN_ID}-${GITHUB_JOB}" > cache-probe/marker.txt
          cat cache-probe/marker.txt
      - name: Save
        uses: actions/cache/save@v4
        with:
          path: cache-probe
          key: wo-seed-${{ github.run_id }}-${{ github.run_attempt }}

  write-only-save:
    runs-on: ubuntu-latest
    cache-mode: write-only
    steps:
      - name: Create marker
        run: |
          mkdir -p cache-probe
          printf '%s\n' "wo-${GITHUB_RUN_ID}-${GITHUB_JOB}" > cache-probe/marker.txt
          cat cache-probe/marker.txt
      - name: Attempt save
        uses: actions/cache/save@v4
        with:
          path: cache-probe
          key: wo-writeonly-${{ github.run_id }}-${{ github.run_attempt }}

  write-only-restore:
    runs-on: ubuntu-latest
    cache-mode: write-only
    steps:
      - name: Attempt restore of seed key
        id: r
        uses: actions/cache/restore@v4
        with:
          path: cache-probe
          key: wo-seed-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: false

      - name: Show marker if restored
        if: steps.r.outputs.cache-hit == 'true'
        run: cat cache-probe/marker.txt
