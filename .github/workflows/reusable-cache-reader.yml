name: Reusable Cache Reader
on:
  workflow_call:

jobs:
  inspect-and-read:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect JWT Token Claims
        run: |
          echo "=== DECODING ACTIONS_RUNTIME_TOKEN ==="
          PAYLOAD=$(echo "$ACTIONS_RUNTIME_TOKEN" | cut -d'.' -f2)
          mod=$(($(echo -n "$PAYLOAD" | wc -c) % 4))
          if [ $mod -eq 2 ]; then PAYLOAD="${PAYLOAD}=="; fi
          if [ $mod -eq 3 ]; then PAYLOAD="${PAYLOAD}="; fi
          echo "$PAYLOAD" | base64 -d | jq .

      - name: Attempt Manual Cache Query via Raw API
        run: |
          python3 -c "
          import os, urllib.request, json

          runtime_url = os.environ.get('ACTIONS_CACHE_URL') or os.environ.get('ACTIONS_RESULTS_URL')
          token = os.environ.get('ACTIONS_RUNTIME_TOKEN')

          print(f'Target Endpoint: {runtime_url}')

          req_url = f'{runtime_url}_apis/artifactcache/cache?keys=lab-secret-cache-v1'
          req = urllib.request.Request(req_url, headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/json;api-version=6.0-preview.1'
          })

          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  print('RESPONSE SUCCESS:')
                  print(json.dumps(data, indent=2))
          except Exception as e:
              print(f'RESPONSE ERROR: {e}')
          "
