name: Cache permissions precedence

on:
  workflow_dispatch:

permissions: {}

cache-mode: read

jobs:
  allowed:
    runs-on: ubuntu-latest
    cache-mode: write
    steps:
      - name: Create marker
        run: |
          mkdir -p cache-probe
          printf '%s\n' "prec-${GITHUB_RUN_ID}-${GITHUB_JOB}" > cache-probe/marker.txt
          cat cache-probe/marker.txt
      - name: Attempt save
        uses: actions/cache/save@v4
        with:
          path: cache-probe
          key: prec-wfjw-${{ github.run_id }}-${{ github.run_attempt }}

  call-write-caller:
    uses: ./.github/workflows/cache-reusable-caller.yml

  verify:
    runs-on: ubuntu-latest
    needs: [allowed, call-write-caller]
    cache-mode: read
    steps:
      - name: Check wfjw (wf=read, job=write)
        uses: actions/cache/restore@v4
        with:
          path: cache-probe
          key: prec-wfjw-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: false

      - name: Check from-caller
        uses: actions/cache/restore@v4
        with:
          path: cache-probe
          key: from-caller-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: false
