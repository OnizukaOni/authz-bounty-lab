name: Cache permission boundary check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  positive:
    if: github.repository == 'OnizukaOni/authz-bounty-lab'
    cache-mode: write
    uses: ./.github/workflows/cache-writer.yml
    with:
      label: positive

  restricted:
    if: github.repository == 'OnizukaOni/authz-bounty-lab'
    cache-mode: read
    uses: ./.github/workflows/cache-writer.yml
    with:
      label: restricted

  verify:
    if: always() && github.repository == 'OnizukaOni/authz-bounty-lab'
    needs: [positive, restricted]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    cache-mode: read
    steps:
      - name: Look up positive-control cache
        id: positive
        uses: actions/cache/restore@v4
        with:
          path: cache-probe
          key: authz-probe-${{ github.run_id }}-${{ github.run_attempt }}-positive
          lookup-only: true
      - name: Look up restricted cache
        id: restricted
        uses: actions/cache/restore@v4
        with:
          path: cache-probe
          key: authz-probe-${{ github.run_id }}-${{ github.run_attempt }}-restricted
          lookup-only: true
      - name: Record observations without credentials
        env:
          POSITIVE_HIT: ${{ steps.positive.outputs.cache-hit }}
          RESTRICTED_HIT: ${{ steps.restricted.outputs.cache-hit }}
          POSITIVE_JOB: ${{ needs.positive.result }}
          RESTRICTED_JOB: ${{ needs.restricted.result }}
        run: |
          {
            printf 'Positive job: %s\n\n' "$POSITIVE_JOB"
            printf 'Restricted job: %s\n\n' "$RESTRICTED_JOB"
            printf 'Positive cache hit: %s\n\n' "$POSITIVE_HIT"
            printf 'Restricted cache hit: %s\n\n' "$RESTRICTED_HIT"
            if [ "$POSITIVE_HIT" != 'true' ]; then
              printf 'INCONCLUSIVE: positive control did not establish cache operation.\n'
            elif [ "$RESTRICTED_HIT" = 'true' ]; then
              printf 'REVIEW REQUIRED: restricted cache exists. This is not yet a confirmed vulnerability.\n'
            else
              printf 'No restricted cache observed. Review job logs for enforcement or unrelated failures.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
