name: Cache reusable caller

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

cache-mode: write

jobs:
  call-child:
    uses: ./.github/workflows/cache-reusable-child.yml

  caller-save:
    runs-on: ubuntu-latest
    cache-mode: write
    steps:
      - name: Create marker
        run: |
          mkdir -p cache-probe
          printf '%s\n' "caller-${GITHUB_RUN_ID}-${GITHUB_JOB}" > cache-probe/marker.txt
          cat cache-probe/marker.txt
      - name: Attempt save
        uses: actions/cache/save@v4
        with:
          path: cache-probe
          key: from-caller-${{ github.run_id }}-${{ github.run_attempt }}
