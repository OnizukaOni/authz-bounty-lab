name: Cache reusable caller

on:
  workflow_dispatch:

permissions: {}

cache-mode: read

jobs:
  call-child:
    uses: ./.github/workflows/cache-reusable-child.yml

  verify-child:
    runs-on: ubuntu-latest
    needs: [call-child]
    cache-mode: read
    steps:
      - name: Check child-wf-write
        uses: actions/cache/restore@v4
        with:
          path: cache-probe
          key: child-wf-write-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: false

      - name: Check child-job-write
        uses: actions/cache/restore@v4
        with:
          path: cache-probe
          key: child-job-write-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: false
