name: reusable-cache-test

on:
  workflow_call:

cache-mode: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Record context and create harmless marker
        shell: bash
        run: |
          printf 'repository=%s\nrun_id=%s\nrun_attempt=%s\ncache_mode=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" "$ACTIONS_CACHE_MODE"
          mkdir -p cache-test
          printf 'boundary-probe-%s-%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > cache-test/marker.txt

      - name: Try to save cache
        uses: actions/cache/save@v4
        with:
          path: cache-test
          key: cache-mode-test-${{ github.run_id }}-${{ github.run_attempt }}
