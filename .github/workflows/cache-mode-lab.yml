name: Cache mode laboratory
run-name: Cache lab - ${{ inputs.phase }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: First produce, then verify in a separate run
        type: choice
        options:
          - produce
          - verify
        default: produce
        required: true
      source:
        description: For verify only - source RUN_ID-RUN_ATTEMPT from produce summary
        type: string
        default: ''
        required: false

permissions:
  contents: read

jobs:
  write-control:
    if: inputs.phase == 'produce'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    cache-mode: write
    env:
      TEST_CASE: write
      TEST_KEY: cache-mode-lab-${{ github.run_id }}-${{ github.run_attempt }}-write
    steps:
      - name: Prepare isolated marker and local action
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache-lab-action .cache-lab-data
          printf '%s\n' "$TEST_KEY" > .cache-lab-data/marker.txt
          curl --fail --silent --show-error --location --retry 2 \
            https://raw.githubusercontent.com/actions/cache/3edfce9056124e459a23f683a21433670d47daca/dist/save-only/index.js \
            -o .cache-lab-action/upstream.js
          printf '%s\n' '{"type":"module"}' > .cache-lab-action/package.json
          cat > .cache-lab-action/action.yml <<'YAML'
          name: Cache mode laboratory
          description: Run pinned save action with an optional in-process mode override
          inputs:
            path:
              required: true
              description: Marker directory
            key:
              required: true
              description: Unique test key
          runs:
            using: node24
            main: wrapper.js
          YAML
          cat > .cache-lab-action/wrapper.js <<'JS'
          import assert from 'node:assert/strict';
          const expected = process.env.TEST_CASE === 'write' ? 'write' : 'read';
          assert.equal(process.env.ACTIONS_CACHE_MODE, expected,
            'Unexpected runner mode; experiment is invalid');
          assert.ok(process.env.ACTIONS_RUNTIME_TOKEN, 'Runtime token missing');
          assert.ok(process.env.ACTIONS_CACHE_SERVICE_V2, 'This experiment requires cache service v2');
          const originalToken = process.env.ACTIONS_RUNTIME_TOKEN;
          console.log('LAB case=' + process.env.TEST_CASE + ' runner-mode=' + expected);
          if (process.env.TEST_CASE === 'probe') {
            process.env.ACTIONS_CACHE_MODE = 'write';
          }
          assert.equal(process.env.ACTIONS_RUNTIME_TOKEN, originalToken);
          console.log('LAB client-mode=' + process.env.ACTIONS_CACHE_MODE + ' token-unchanged=true');
          await import('./upstream.js');
          JS
      - name: Attempt marker save
        uses: ./.cache-lab-action
        with:
          path: .cache-lab-data
          key: ${{ env.TEST_KEY }}

      - name: Print verification ID
        run: |
          echo "Verification source: ${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Use the same repository and branch for the verify run." >> "$GITHUB_STEP_SUMMARY"

  read-cases:
    if: inputs.phase == 'produce'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    cache-mode: read
    strategy:
      fail-fast: false
      matrix:
        test_case: [read, probe]
    env:
      TEST_CASE: ${{ matrix.test_case }}
      TEST_KEY: cache-mode-lab-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.test_case }}
    steps:
      - name: Prepare isolated marker and local action
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache-lab-action .cache-lab-data
          printf '%s\n' "$TEST_KEY" > .cache-lab-data/marker.txt
          curl --fail --silent --show-error --location --retry 2 \
            https://raw.githubusercontent.com/actions/cache/3edfce9056124e459a23f683a21433670d47daca/dist/save-only/index.js \
            -o .cache-lab-action/upstream.js
          printf '%s\n' '{"type":"module"}' > .cache-lab-action/package.json
          cat > .cache-lab-action/action.yml <<'YAML'
          name: Cache mode laboratory
          description: Run pinned save action with an optional in-process mode override
          inputs:
            path:
              required: true
              description: Marker directory
            key:
              required: true
              description: Unique test key
          runs:
            using: node24
            main: wrapper.js
          YAML
          cat > .cache-lab-action/wrapper.js <<'JS'
          import assert from 'node:assert/strict';
          const expected = process.env.TEST_CASE === 'write' ? 'write' : 'read';
          assert.equal(process.env.ACTIONS_CACHE_MODE, expected,
            'Unexpected runner mode; experiment is invalid');
          assert.ok(process.env.ACTIONS_RUNTIME_TOKEN, 'Runtime token missing');
          assert.ok(process.env.ACTIONS_CACHE_SERVICE_V2, 'This experiment requires cache service v2');
          const originalToken = process.env.ACTIONS_RUNTIME_TOKEN;
          console.log('LAB case=' + process.env.TEST_CASE + ' runner-mode=' + expected);
          if (process.env.TEST_CASE === 'probe') {
            process.env.ACTIONS_CACHE_MODE = 'write';
          }
          assert.equal(process.env.ACTIONS_RUNTIME_TOKEN, originalToken);
          console.log('LAB client-mode=' + process.env.ACTIONS_CACHE_MODE + ' token-unchanged=true');
          await import('./upstream.js');
          JS
      - name: Attempt marker save
        uses: ./.cache-lab-action
        with:
          path: .cache-lab-data
          key: ${{ env.TEST_KEY }}

  verify:
    if: inputs.phase == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    cache-mode: read
    strategy:
      fail-fast: false
      matrix:
        test_case: [write, read, probe]
    env:
      SOURCE: ${{ inputs.source }}
      TEST_CASE: ${{ matrix.test_case }}
    steps:
      - name: Validate source and prepare clean destination
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE" =~ ^[0-9]+-[0-9]+$ ]] || { echo "Source must be RUN_ID-RUN_ATTEMPT"; exit 1; }
          test ! -e .cache-lab-data
          echo "TEST_KEY=cache-mode-lab-$SOURCE-$TEST_CASE" >> "$GITHUB_ENV"
      - name: Restore exact marker key
        id: restore
        uses: actions/cache/restore@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: .cache-lab-data
          key: ${{ env.TEST_KEY }}
      - name: Report observation
        shell: bash
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "$CACHE_HIT" == "true" ]]; then
            test -f .cache-lab-data/marker.txt
            printf '%s\n' "$TEST_KEY" | cmp - .cache-lab-data/marker.txt
            echo "$TEST_CASE: RESTORED_EXACT_MARKER" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "$TEST_CASE: NO_EXACT_HIT - inspect restore logs before interpreting" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

