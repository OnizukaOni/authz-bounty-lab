name: reusable-secret-test
on: workflow_call
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Dump secrets context keys
        run: echo '${{ toJSON(secrets) }}'
      - name: Direct reference check
        run: |
          echo "CONTROL_SECRET present: ${{ secrets.CONTROL_SECRET != '' }}"
          echo "LAB_SECRET present (should be false if isolated): ${{ secrets.LAB_SECRET != '' }}"
